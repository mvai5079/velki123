<!DOCTYPE html>
<html lang="bn" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>৪০৪ — পেজ পাওয়া যায়নি | Velki123.cc</title>
  <meta name="description" content="দুঃখিত! আপনি যে পেজটি খুঁজছেন সেটি পাওয়া যায়নি। Velki123.cc হোমপেজে ফিরে যান।" />
  <link rel="canonical" href="https://velki123.cc/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #080808;
      --cream: #f2ede3;
      --accent: #ff3c00;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--black);
      font-family: 'Hind Siliguri', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 20vw, 180px);
      line-height: 1;
      letter-spacing: 8px;
      color: var(--black);
      opacity: 0.08;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      user-select: none;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 400px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 8vw, 56px);
      letter-spacing: 4px;
      margin-bottom: 1rem;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-block;
      background: var(--black);
      color: #ccff00;
      text-decoration: none;
      padding: 0.85rem 2.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 3px solid var(--black);
      box-shadow: 5px 5px 0 var(--black);
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 var(--black);
    }

    .btn-home:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--black);
    }
  </style>
</head>

<body>
  <div class="error-code" aria-hidden="true">404</div>
  <div class="content">
    <h1>পেজ পাওয়া <span>যায়নি</span></h1>
    <p>দুঃখিত! আপনি যে পেজটি খুঁজছেন সেটি মুছে ফেলা হয়েছে, নাম পরিবর্তন করা হয়েছে, অথবা সাময়িকভাবে অনুপলব্ধ।</p>
    <a href="/" class="btn-home" aria-label="হোমপেজে ফিরে যান">← হোমে ফিরে যান</a>
  </div>
</body>

</html>
